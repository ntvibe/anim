<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>anim experiments</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111214; color: #f4f4f5; }
    main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 7vw, 72px); letter-spacing: -0.045em; }
    p { color: #a1a1aa; max-width: 62ch; line-height: 1.6; }
    .grid { display: grid; gap: 16px; margin-top: 40px; }
    a { display: block; color: inherit; text-decoration: none; border: 1px solid #2c2d31; border-radius: 18px; padding: 22px; background: #18191c; }
    a:hover { border-color: #555861; }
    strong { display: block; font-size: 20px; margin-bottom: 8px; }
    small { color: #a1a1aa; }
  </style>
</head>
<body>
  <main>
    <h1>anim</h1>
    <p>Small programmatic motion experiments for removing repetitive After Effects work.</p>
    <div class="grid">
      <a href="./experiments/01-bezier-logo-text/">
        <strong>01 — Bézier logo + text</strong>
        <small>Shared easing curve, local logo upload, editable text, deterministic preview, GIF export.</small>
      </a>
    </div>
  </main>
</body>
</html>
