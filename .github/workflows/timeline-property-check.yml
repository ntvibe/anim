name: Timeline property editor check
on:
  push:
    branches: [timeline-property-keyframes-stagger-curves]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check timeline property editor
        run: |
          node --check experiments/01-bezier-logo-text/timeline-details.js
          node --check experiments/01-bezier-logo-text/boot-guard.js
          grep -q "Position X" experiments/01-bezier-logo-text/timeline-details.js
          grep -q "Word stagger" experiments/01-bezier-logo-text/timeline-details.js
          grep -q "curve-resize-grip" experiments/01-bezier-logo-text/timeline-details.js
          grep -q "CURVE_SCALE_STEPS" experiments/01-bezier-logo-text/timeline-details.js
          grep -q "property-value-chip" experiments/01-bezier-logo-text/timeline-details.css
          grep -q "timeline-details.js?v=6.6.0" experiments/01-bezier-logo-text/boot-guard.js
