name: Word stagger patch
on:
  push:
    branches: [fix-word-stagger]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary word stagger patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-word-stagger
      - name: Patch renderer and controls
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('experiments/01-bezier-logo-text')
          app_path = root / 'app.js'
          html_path = root / 'index.html'
          css_path = root / 'style.css'
          app = app_path.read_text()
          html = html_path.read_text()
          css = css_path.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              return text.replace(old, new, 1)

          app = replace_once(
              app,
              "scaleFrom: type === 'text' ? .96 : .94, stagger: type === 'text' ? 35 : 0,\n    enterBezier:",
              "scaleFrom: type === 'text' ? .96 : .94, stagger: type === 'text' ? 35 : 0, staggerOrder: 'forward', staggerPhase: 'enter',\n    enterBezier:",
              'reveal defaults stagger metadata'
          )

          app = replace_once(
              app,
              "function revealDuration(layer) {\n  if (!isVisual(layer) || !layer.reveal.enabled) return 0;\n  const r = layer.reveal;\n  return Math.max(1, r.enter + r.hold + r.exit);\n}",
              "function textWordCount(layer) { return layer?.type === 'text' ? Math.max(1, layer.content?.text?.trim().split(/\\s+/).filter(Boolean).length || 1) : 1; }\nfunction staggerSpan(layer) {\n  if (layer?.type !== 'text') return 0;\n  const r = layer.reveal, count = textWordCount(layer);\n  return Math.max(0, count - 1) * Math.max(0, Number(r.stagger) || 0);\n}\nfunction revealDuration(layer) {\n  if (!isVisual(layer) || !layer.reveal.enabled) return 0;\n  const r = layer.reveal, span = staggerSpan(layer), phase = r.staggerPhase || 'enter';\n  const enterSpan = layer.type === 'text' && (phase === 'enter' || phase === 'both') ? span : 0;\n  const exitSpan = layer.type === 'text' && (phase === 'exit' || phase === 'both') ? span : 0;\n  return Math.max(1, r.enter + enterSpan + r.hold + r.exit + exitSpan);\n}",
              'reveal duration'
          )

          old_reveal_state = """function revealState(layer, ms, wordIndex = 0, wordCount = 1) {
  if (!isVisual(layer) || !layer.reveal.enabled) return { alpha: 1, x: 0, y: 0, scale: 1 };
  const r = layer.reveal, local = ms - r.start;
  if (local < 0) return { alpha: 0, x: 0, y: 0, scale: r.scaleFrom };
  const stagger = layer.type === 'text' && wordCount > 1 ? wordIndex * r.stagger : 0;
  const enterStart = stagger, enterEnd = enterStart + r.enter;
  const enterVec = directionVector(r.enterDirection), exitVec = directionVector(r.exitDirection);
  if (local < enterEnd) {
    const p = cubicBezierEase(clamp((local-enterStart)/Math.max(1,r.enter),0,1), ...r.enterBezier);
    return { alpha: p, x: enterVec[0]*r.travel*(1-p), y: enterVec[1]*r.travel*(1-p), scale: lerp(r.scaleFrom,1,p) };
  }
  const exitStart = r.enter + r.hold;
  if (local <= exitStart) return { alpha: 1, x: 0, y: 0, scale: 1 };
  const p = cubicBezierEase(clamp((local-exitStart)/Math.max(1,r.exit),0,1), ...r.exitBezier);
  return { alpha: 1-p, x: exitVec[0]*r.travel*p, y: exitVec[1]*r.travel*p, scale: 1 };
}"""
          new_reveal_state = """function staggerRank(index, count, order = 'forward') {
  if (count <= 1) return 0;
  if (order === 'reverse') return count - 1 - index;
  if (order === 'center' || order === 'edges') {
    const mid = (count - 1) / 2;
    const ordered = Array.from({ length: count }, (_, i) => i).sort((a, b) => {
      const da = Math.abs(a - mid), db = Math.abs(b - mid);
      return order === 'center' ? (da - db || a - b) : (db - da || a - b);
    });
    return ordered.indexOf(index);
  }
  return index;
}
function revealState(layer, ms, wordIndex = 0, wordCount = 1) {
  if (!isVisual(layer) || !layer.reveal.enabled) return { alpha: 1, x: 0, y: 0, scale: 1 };
  const r = layer.reveal, local = ms - r.start;
  if (local < 0) return { alpha: 0, x: 0, y: 0, scale: r.scaleFrom };
  const isTextStagger = layer.type === 'text' && wordCount > 1 && r.stagger > 0;
  const rank = isTextStagger ? staggerRank(wordIndex, wordCount, r.staggerOrder || 'forward') : 0;
  const amount = isTextStagger ? Math.max(0, Number(r.stagger) || 0) : 0;
  const phase = r.staggerPhase || 'enter';
  const maxSpan = Math.max(0, wordCount - 1) * amount;
  const enterDelay = phase === 'enter' || phase === 'both' ? rank * amount : 0;
  const exitDelay = phase === 'exit' || phase === 'both' ? rank * amount : 0;
  const enterBlockSpan = phase === 'enter' || phase === 'both' ? maxSpan : 0;
  const enterStart = enterDelay, enterEnd = enterStart + r.enter;
  const enterVec = directionVector(r.enterDirection), exitVec = directionVector(r.exitDirection);
  if (local < enterStart) return { alpha: 0, x: enterVec[0]*r.travel, y: enterVec[1]*r.travel, scale: r.scaleFrom };
  if (local < enterEnd) {
    const p = cubicBezierEase(clamp((local-enterStart)/Math.max(1,r.enter),0,1), ...r.enterBezier);
    return { alpha: p, x: enterVec[0]*r.travel*(1-p), y: enterVec[1]*r.travel*(1-p), scale: lerp(r.scaleFrom,1,p) };
  }
  const exitStart = r.enter + enterBlockSpan + r.hold + exitDelay;
  if (local <= exitStart) return { alpha: 1, x: 0, y: 0, scale: 1 };
  const p = cubicBezierEase(clamp((local-exitStart)/Math.max(1,r.exit),0,1), ...r.exitBezier);
  return { alpha: 1-p, x: exitVec[0]*r.travel*p, y: exitVec[1]*r.travel*p, scale: 1 };
}"""
          app = replace_once(app, old_reveal_state, new_reveal_state, 'reveal state')

          app = replace_once(
              app,
              "context.transform(...world);context.translate(center+reveal.x,reveal.y);context.scale(reveal.scale,reveal.scale);context.translate(-center,0);drawSpacedText(context,word,c.letterSpacing,0);",
              "context.transform(...world);context.translate(center+reveal.x,reveal.y);context.scale(reveal.scale,reveal.scale);drawSpacedText(context,word,c.letterSpacing,0);",
              'word position transform'
          )

          app = replace_once(
              app,
              "$('wordStaggerWrap').hidden=l.type!=='text';$('wordStagger').value=r.stagger;$('wordStaggerOut').textContent=`${Math.round(r.stagger)} ms`;}",
              "$('wordStaggerWrap').hidden=l.type!=='text';$('wordStagger').value=r.stagger;$('wordStaggerOut').textContent=`${Math.round(r.stagger)} ms`;$('wordStaggerOrder').value=r.staggerOrder||'forward';$('wordStaggerPhase').value=r.staggerPhase||'enter';}",
              'sync stagger controls'
          )

          stagger_binding_anchor = """  bindSimple('enterDirection',()=>selectedLayer().reveal.enterDirection,v=>selectedLayer().reveal.enterDirection=v,{after:()=>renderFrame(playhead)});bindSimple('exitDirection',()=>selectedLayer().reveal.exitDirection,v=>selectedLayer().reveal.exitDirection=v,{after:()=>renderFrame(playhead)});
"""
          stagger_binding_new = stagger_binding_anchor + """  bindSimple('wordStaggerOrder',()=>selectedLayer().reveal.staggerOrder||'forward',v=>selectedLayer().reveal.staggerOrder=v,{after:()=>{syncMotionInspector();syncTimeline();syncPlayhead();}});
  bindSimple('wordStaggerPhase',()=>selectedLayer().reveal.staggerPhase||'enter',v=>selectedLayer().reveal.staggerPhase=v,{after:()=>{syncMotionInspector();syncTimeline();syncPlayhead();}});
"""
          app = replace_once(app, stagger_binding_anchor, stagger_binding_new, 'stagger bindings')

          old_stagger_html = '<label id="wordStaggerWrap">Word stagger<input id="wordStagger" type="range" min="0" max="200" step="5"/><output id="wordStaggerOut"></output></label>'
          new_stagger_html = '<div id="wordStaggerWrap" class="stagger-controls"><div class="mini-heading"><strong>Word stagger</strong><span>text layers only</span></div><label>Delay per word<input id="wordStagger" type="range" min="0" max="300" step="5"/><output id="wordStaggerOut"></output></label><div class="two-col"><label>Order<select id="wordStaggerOrder"><option value="forward">First → Last</option><option value="reverse">Last → First</option><option value="center">Center → Out</option><option value="edges">Edges → In</option></select></label><label>Apply to<select id="wordStaggerPhase"><option value="enter">Entrance</option><option value="exit">Exit</option><option value="both">Entrance + Exit</option></select></label></div><p class="hint">Each word keeps its normal layout position; stagger only offsets when its reveal starts.</p></div>'
          html = replace_once(html, old_stagger_html, new_stagger_html, 'stagger inspector HTML')
          html = html.replace('./style.css?v=6.1.1', './style.css?v=6.1.2')
          html = html.replace('./app.js?v=6.1.1', './app.js?v=6.1.2')

          if '.stagger-controls{' not in css:
              css += "\n.stagger-controls{margin-top:10px;padding-top:10px;border-top:1px solid rgba(118,140,170,.12);display:grid;gap:10px}.stagger-controls>label{gap:7px}.stagger-controls output{font-size:9px;color:var(--accent);font-weight:650}\n"

          app_path.write_text(app)
          html_path.write_text(html)
          css_path.write_text(css)
          PY
      - name: Validate patch
        run: |
          node --check experiments/01-bezier-logo-text/app.js
          python - <<'PY'
          import re, pathlib, sys
          root=pathlib.Path('experiments/01-bezier-logo-text')
          js=(root/'app.js').read_text()
          html=(root/'index.html').read_text()
          refs=set(re.findall(r"\$\('([^']+)'\)",js))
          ids=set(re.findall(r'id="([^"]+)"',html))
          missing=sorted(refs-ids)
          print('missing ids:',missing)
          if missing: sys.exit(1)
          assert 'context.translate(-center,0)' not in js
          assert 'wordStaggerOrder' in js and 'wordStaggerPhase' in js
          PY
      - name: Commit patch
        run: |
          git config user.name "ntvibe"
          git config user.email "hakerche@gmail.com"
          git add experiments/01-bezier-logo-text/app.js experiments/01-bezier-logo-text/index.html experiments/01-bezier-logo-text/style.css
          git commit -m "Fix word stagger layout and controls"
          git push origin HEAD:fix-word-stagger
