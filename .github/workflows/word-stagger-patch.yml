name: Word stagger patch
on:
  push:
    branches:
      - fix-word-stagger
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Use simple word stagger patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-word-stagger
      - name: Apply patch
        run: python tools/patch_word_stagger.py
      - name: Validate JavaScript and controller IDs
        run: |
          node --check experiments/01-bezier-logo-text/app.js
          python - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('experiments/01-bezier-logo-text')
          js = (root / 'app.js').read_text()
          html = (root / 'index.html').read_text()
          refs = set(re.findall(r"\$\('([^']+)'\)", js))
          ids = set(re.findall(r'id="([^"]+)"', html))
          missing = sorted(refs - ids)
          print('missing ids:', missing)
          if missing:
              sys.exit(1)
          assert 'context.translate(-center,0)' not in js
          assert 'wordStaggerOrder' in js
          assert 'wordStaggerPhase' in js
          PY
      - name: Commit patch
        run: |
          git config user.name "ntvibe"
          git config user.email "hakerche@gmail.com"
          git add experiments/01-bezier-logo-text/app.js experiments/01-bezier-logo-text/index.html experiments/01-bezier-logo-text/style.css
          git commit -m "Fix word stagger layout and controls"
          git push origin HEAD:fix-word-stagger
