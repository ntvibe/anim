name: Mobile timeline syntax check
on:
  push:
    branches: [mobile-timeline-pinch-deselect]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check mobile timeline files
        run: |
          node --check experiments/01-bezier-logo-text/mobile-timeline.js
          node --check experiments/01-bezier-logo-text/boot-guard.js
          grep -q "MAX_ZOOM = 8" experiments/01-bezier-logo-text/mobile-timeline.js
          grep -q "clearSelection" experiments/01-bezier-logo-text/mobile-timeline.js
          grep -q "position:sticky" experiments/01-bezier-logo-text/mobile-timeline.css
