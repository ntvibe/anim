name: Enhancement syntax check
on:
  push:
    branches: [transform-parenting-video-exports]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check editor enhancement syntax
        run: |
          node --check experiments/01-bezier-logo-text/app.js
          node --check experiments/01-bezier-logo-text/boot-guard.js
          node --check experiments/01-bezier-logo-text/enhancements.js
          grep -q "Animated WebP" experiments/01-bezier-logo-text/enhancements.js
          grep -q "libvpx-vp9" experiments/01-bezier-logo-text/enhancements.js
          grep -q "libx264" experiments/01-bezier-logo-text/enhancements.js
