name: Timeline parenting patch
on:
  push:
    branches:
      - fix-timeline-scrub-parent-pickup
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary timeline parenting patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-timeline-scrub-parent-pickup
      - name: Apply patch
        run: python tools/patch_timeline_parenting.py
      - name: Validate JavaScript and static controller IDs
        run: |
          node --check experiments/01-bezier-logo-text/app.js
          python - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('experiments/01-bezier-logo-text')
          js = (root / 'app.js').read_text()
          html = (root / 'index.html').read_text()
          refs = set(re.findall(r"\$\('([^']+)'\)", js))
          ids = re.findall(r'id="([^"]+)"', html)
          missing = sorted(refs - set(ids))
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          print('missing ids:', missing)
          print('duplicate ids:', duplicates)
          if missing or duplicates:
              sys.exit(1)
          assert 'parentStartMs' in js
          assert 'beginTimelineScrub' in js
          assert "e.target.closest('.timeline-playhead')" in js
          assert 'timeline-interacting' in js
          assert 'class="viewport-actions"' not in html
          PY
      - name: Commit patch
        run: |
          git config user.name "ntvibe"
          git config user.email "hakerche@gmail.com"
          git add experiments/01-bezier-logo-text/app.js experiments/01-bezier-logo-text/index.html experiments/01-bezier-logo-text/style.css
          git commit -m "Improve timeline scrubbing and parent pickup behavior"
          git push origin HEAD:fix-timeline-scrub-parent-pickup
